services:
  app:
    image: ${HARBOR_REGISTRY:-192.168.0.51:8080}/rvscope/rvscope:${RVSCOPE_IMAGE_TAG:-homolog}
    pull_policy: always
    container_name: rvscope_app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rvscope}
      POSTGRES_USER: ${POSTGRES_USER:-rvscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rvscope_password}
    ports:
      - "8443:8443"
    volumes:
      - ./.env:/var/www/html/.env:Z
      - ./writable:/var/www/html/writable:Z
      - ./imports:/app/imports:Z
      - ./certs:/etc/ssl/private:ro,Z
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: rvscope_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rvscope}
      POSTGRES_USER: ${POSTGRES_USER:-rvscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rvscope_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
